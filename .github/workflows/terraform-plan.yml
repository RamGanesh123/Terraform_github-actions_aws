name: Terraform Plan (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure (debug)
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== terraform-github-actions-aws ==="
          ls -la terraform-github-actions-aws
          echo "=== Selected environment folder ==="
          ls -la terraform-github-actions-aws/envs/${{ github.event.inputs.environment }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          

      - name: Terraform Init
        run: |
          cd terraform-github-actions-aws/envs/${{ github.event.inputs.environment }}
          terraform init
          
     

      # - name: Terraform Format
      #   run: |
      #     cd terraform-github-actions-aws/envs/${{ github.event.inputs.environment }}
      #     terraform fmt -check

      # - name: Terraform Validate
      #   run: |
      #     cd terraform-github-actions-aws/envs/${{ github.event.inputs.environment }}
      #     terraform validate

      - name: Terraform Plan
        run: |
          cd terraform-github-actions-aws/envs/${{ github.event.inputs.environment }}
          terraform plan
